<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script src="https://cdn.tailwindcss.com"></script>
		<style>
			html,
			body {
				background: transparent;
			}
		</style>
	</head>
	<body>
		<!-- The server pushes the rendered Kire page into #app via SendNuiMessage. -->
		<div id="app"></div>

		<!-- Bundled Kirewire client (built from nui-boot.ts → nui/client.js). -->
		<script type="module" src="./client.js"></script>

		<script>
			window.addEventListener("message", (event) => {
				const data = event.data || {};
				if (data.type === "page") {
					document.getElementById("app").innerHTML = data.html;
					// Re-scan the freshly injected DOM for Kirewire components.
					window.Kirewire?.start?.();
				}
				if (data.type === "close") {
					document.getElementById("app").innerHTML = "";
				}
			});
		</script>
	</body>
</html>
